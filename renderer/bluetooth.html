<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
<link rel="stylesheet" href="bluetooth.css">
</head>
<body>
<div id="panel">
  <header id="head">
    <div id="head-left">
      <svg class="bt-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.71 7.71 12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z"/></svg>
      <span>Bluetooth</span>
    </div>
    <div id="head-right">
      <button id="refresh" title="Refresh devices" aria-label="Refresh devices">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.45 10.95h-2.16A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
      <button id="radio-toggle" role="switch" aria-checked="false" aria-label="Toggle Bluetooth" title="Turn Bluetooth on or off">
        <span class="knob"></span>
      </button>
    </div>
  </header>

  <div id="msg" hidden></div>
  <div id="list" role="list"></div>

  <footer id="foot">
    <button id="settings-btn">Bluetooth settings…</button>
    <button id="close-btn" title="Close (Esc)">Done</button>
  </footer>
</div>
<script src="bluetooth.js"></script>
</body>
</html>
