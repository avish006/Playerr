<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
<style>
html, body { margin: 0; height: 100%; overflow: hidden; }
button { display: grid; place-items: center; width: 100%; height: 100%; padding: 0; border: 1px solid #ffffff35; border-radius: 8px; color: #fff; background: #15151be8; cursor: pointer; }
button:hover { background: #373740; border-color: #ffffff75; }
svg { width: 65%; height: 65%; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
button[aria-pressed="true"] .unlocked, button[aria-pressed="false"] .locked { display: none; }
</style>
<title>Click-through mode</title>
</head>
<body>
<button type="button" aria-label="Click-through mode" aria-pressed="true" title="Click-through on. Click to use player controls.">
  <svg viewBox="0 0 20 20" aria-hidden="true">
    <rect x="4.5" y="9" width="11" height="8" rx="2"/>
    <path class="locked" d="M7 9V6a3 3 0 0 1 6 0v3"/>
    <path class="unlocked" d="M7 9V4.5a4 3 0 0 1 8 0"/>
    <path d="M10 12v2"/>
  </svg>
</button>
<script src="lock.js"></script>
</body>
</html>
