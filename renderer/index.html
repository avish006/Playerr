<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="record">
    <div id="cd">
      <div id="disc"><div id="art"></div><div id="grooves"></div></div>
      <div id="shine"></div>
      <div id="hub"></div>
    </div>
  </div>
  <div id="info">
    <div id="title">Starting…</div>
    <div id="artist">Looking for a media session</div>
    <div id="bar">
      <span id="cur">0:00</span>
      <div id="track"><div id="rail"><div id="fill"></div></div></div>
      <span id="dur">0:00</span>
    </div>
    <div id="ctrl">
      <button class="repeat" data-c="repeat-all" aria-label="Repeat" aria-pressed="false" title="Repeat · Select the Spotify tab to enable repeat" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button>
      <button data-c="prev" title="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg></button>
      <button id="pp" data-c="toggle" title="Play / pause">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>
      </button>
      <button data-c="next" title="Next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg></button>
      <button class="repeat" data-c="repeat-one" aria-label="Repeat One" aria-pressed="false" title="Repeat One · Select the Spotify tab to enable repeat" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg><span aria-hidden="true">1</span></button>
    </div>
    <div id="util">
      <button id="mute" data-c="mute" aria-label="Mute" aria-pressed="false" title="Mute / Unmute">
        <svg class="i-vol-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        <svg class="i-vol-low" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.5 12A4.5 4.5 0 0 0 16 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/></svg>
        <svg class="i-vol-mute" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
      </button>
      <div id="vol-track" role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="vol-rail"><div id="vol-fill"></div></div>
      </div>
      <span id="vol-pct">0%</span>
      <button id="bt-btn" aria-label="Bluetooth" aria-pressed="false" title="Bluetooth devices">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.71 7.71 12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z"/></svg>
      </button>
    </div>
  </div>
  <div id="grip" title="Drag to resize"></div>
</div>
<script src="renderer.js"></script>
</body>
</html>
